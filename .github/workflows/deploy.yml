name: Publicar extensao

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar extensao
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Enviar build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5